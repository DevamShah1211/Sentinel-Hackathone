openapi: 3.1.0
info:
  title: Sentinel CCTV Platform
  description: '**Gujarat CCTV Integration Hackathon 2026 — Category 1**


    Model 1 (Camera Registry & GIS Mapping) + Model 2 (Unified Viewing Platform + ANPR).


    Connects to the Sentinel sandbox, reads cameras from `/api/ingest`, provides live HLS/WebRTC viewing,
    ANPR detection indexing with fuzzy plate search, watchlist matching, real-time alerts, and route reconstruction
    on a GIS map.'
  version: 1.0.0
paths:
  /api/v1/auth/token:
    post:
      tags:
      - Auth
      summary: Login (OAuth2 form) — returns a JWT
      operationId: login_form_api_v1_auth_token_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_form_api_v1_auth_token_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login (JSON) — returns a JWT
      operationId: login_json_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: The authenticated user
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
      security:
      - HTTPBearer: []
  /api/v1/auth/roles:
    get:
      tags:
      - Auth
      summary: The role model and what each role may do
      description: Documents the role model so it can be shown, not just asserted.
      operationId: roles_api_v1_auth_roles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Create a user (state admin only)
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/cameras:
    get:
      tags:
      - Cameras (Model 1)
      summary: List all cameras (paginated)
      operationId: list_cameras_api_v1_cameras_get
      security:
      - HTTPBearer: []
      parameters:
      - name: department
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: codec
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Codec
      - name: live_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Live Only
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          default: 200
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CameraOut'
                title: Response List Cameras Api V1 Cameras Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Cameras (Model 1)
      summary: Create a camera record manually
      operationId: create_camera_api_v1_cameras_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cameras/geojson:
    get:
      tags:
      - Cameras (Model 1)
      summary: All cameras as GeoJSON FeatureCollection (for map)
      description: Returns GeoJSON FeatureCollection for Leaflet / MapLibre.
      operationId: cameras_geojson_api_v1_cameras_geojson_get
      security:
      - HTTPBearer: []
      parameters:
      - name: department
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
      - name: live_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Live Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cameras/stats:
    get:
      tags:
      - Cameras (Model 1)
      summary: Department-wise camera statistics
      operationId: camera_stats_api_v1_cameras_stats_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/cameras/live/{native_id}:
    get:
      tags:
      - Cameras (Model 1)
      summary: Live MJPEG stream for a camera
      description: 'Stream a camera as MJPEG.


        Every browser plays this in a plain `<img src=...>` with no player library.

        One upstream RTSP connection is shared by all viewers of a camera, so a

        nine-tile wall costs the gateway nine connections rather than nine per client.'
      operationId: live_stream_api_v1_cameras_live__native_id__get
      parameters:
      - name: native_id
        in: path
        required: true
        schema:
          type: string
          title: Native Id
      - name: profile
        in: query
        required: false
        schema:
          type: string
          pattern: ^(high|balanced|low)$
          description: high = maximised tile, balanced = 2x2, low = 3x3
          default: balanced
          title: Profile
        description: high = maximised tile, balanced = 2x2, low = 3x3
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cameras/live/{native_id}/snapshot:
    get:
      tags:
      - Cameras (Model 1)
      summary: Single current frame from a camera
      description: One JPEG — for map popups and previews, where a full stream is wasteful.
      operationId: live_snapshot_api_v1_cameras_live__native_id__snapshot_get
      parameters:
      - name: native_id
        in: path
        required: true
        schema:
          type: string
          title: Native Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cameras/live-status:
    get:
      tags:
      - Cameras (Model 1)
      summary: Relay status per camera
      description: What the relay is currently doing — useful when a tile will not play.
      operationId: live_status_api_v1_cameras_live_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/cameras/{camera_id}:
    get:
      tags:
      - Cameras (Model 1)
      summary: Get camera by UUID
      operationId: get_camera_api_v1_cameras__camera_id__get
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Camera Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Cameras (Model 1)
      summary: Update a camera record
      operationId: update_camera_api_v1_cameras__camera_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: camera_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Camera Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cameras/proxy-hls/{native_id}/{file_name}:
    get:
      tags:
      - Cameras (Model 1)
      summary: Proxy authenticated HLS stream segments
      description: 'Serve a sandbox HLS playlist or segment on the platform''s own origin.


        The sandbox requires a session cookie, and the browser must never hold one:

        embedding credentials in a stream URL would ship the sandbox password to every

        client that loads the video wall. This endpoint holds the session server-side

        and the browser talks only to us.


        Playlists are rewritten so segment references point back through this proxy;

        otherwise the player would resolve them against the sandbox origin and be

        refused for want of a cookie.'
      operationId: proxy_hls_stream_api_v1_cameras_proxy_hls__native_id___file_name__get
      parameters:
      - name: native_id
        in: path
        required: true
        schema:
          type: string
          title: Native Id
      - name: file_name
        in: path
        required: true
        schema:
          type: string
          title: File Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cameras/bulk-import:
    post:
      tags:
      - Cameras (Model 1)
      summary: Bulk camera onboarding from CSV
      description: "Onboard many cameras at once from a CSV.\n\nThe problem statement asks for \"bulk\
        \ import, manual entry, and API-based\ncamera onboarding\"; this is the first, POST /cameras is\
        \ the second, and the\ncatalogue sync is the third.\n\nRecognised columns (only native_id and\
        \ name are required):\n\n    native_id,name,department,lat,lon,address,rtsp_url,codec,resolution,\n\
        \    camera_type,make,model,connectivity,installation_date,ownership\n\nRows are validated individually\
        \ and a bad row never aborts the import — the\nresponse reports which rows failed and why, so\
        \ a department can fix twelve\nlines rather than resubmit a thousand. dry_run=true validates and\
        \ writes\nnothing, which is how you would check a file before committing it."
      operationId: bulk_import_cameras_api_v1_cameras_bulk_import_post
      security:
      - HTTPBearer: []
      parameters:
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          description: Validate without writing
          default: false
          title: Dry Run
        description: Validate without writing
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_bulk_import_cameras_api_v1_cameras_bulk_import_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/cameras/bulk-import/template:
    get:
      tags:
      - Cameras (Model 1)
      summary: CSV template for bulk onboarding
      description: A ready-to-fill CSV with the recognised columns and one worked example.
      operationId: bulk_import_template_api_v1_cameras_bulk_import_template_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/cameras/health-status:
    get:
      tags:
      - Cameras (Model 1)
      summary: Camera health and maintenance status
      description: 'Per-camera health, as the registry can actually determine it.


        A camera is offline if it has never been contacted, stale if it has not been

        seen for a day, and operational otherwise. Anything the registry does not

        know is reported as unknown rather than assumed good.'
      operationId: camera_health_api_v1_cameras_health_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/detections:
    get:
      tags:
      - Detections / ANPR (Model 2)
      summary: Search detections by plate / time / camera
      description: 'Search detections. With fuzzy=true uses pg_trgm similarity (tolerates one bad character).

        Always joins camera name/location for display.'
      operationId: search_detections_api_v1_detections_get
      security:
      - HTTPBearer: []
      parameters:
      - name: plate
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Plate text — exact, partial, or fuzzy
          title: Plate
        description: Plate text — exact, partial, or fuzzy
      - name: camera_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Camera Id
      - name: from_dt
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From Dt
      - name: to_dt
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To Dt
      - name: fuzzy
        in: query
        required: false
        schema:
          type: boolean
          description: Use pg_trgm fuzzy match
          default: true
          title: Fuzzy
        description: Use pg_trgm fuzzy match
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only detections carrying this event tag
          title: Tag
        description: Only detections carrying this event tag
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      - name: purpose
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Why — recorded in the audit log
          title: Purpose
        description: Why — recorded in the audit log
      - name: case_ref
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Case Ref
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetectionOut'
                title: Response Search Detections Api V1 Detections Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Detections / ANPR (Model 2)
      summary: Ingest a new detection (called by ANPR worker)
      description: 'Ingest one detection from the ANPR worker.


        Guarded because the detection index is the evidentiary record. Unprotected,

        this route let anyone place any registration at any camera at any timestamp

        — which forges the route reconstruction, the exported report, and the

        watchlist alert that fires from it. The worker authenticates like any other

        client; see SENTINEL_WORKER_TOKEN in anpr_worker.py.'
      operationId: create_detection_api_v1_detections_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DetectionCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Detection Api V1 Detections Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/detections/route/{plate_text}:
    get:
      tags:
      - Detections / ANPR (Model 2)
      summary: Route reconstruction — all sightings of a plate ordered by time
      description: 'Returns sorted sightings + computed speed between consecutive cameras.

        Flags physically impossible transitions (>150 km/h).'
      operationId: plate_route_api_v1_detections_route__plate_text__get
      security:
      - HTTPBearer: []
      parameters:
      - name: plate_text
        in: path
        required: true
        schema:
          type: string
          title: Plate Text
      - name: from_dt
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: From Dt
      - name: to_dt
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: To Dt
      - name: purpose
        in: query
        required: false
        schema:
          type: string
          description: Why — recorded in the audit log
          default: investigation
          title: Purpose
        description: Why — recorded in the audit log
      - name: case_ref
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Case Ref
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/detections/recent:
    get:
      tags:
      - Detections / ANPR (Model 2)
      summary: Most recent 50 detections across all cameras
      operationId: recent_detections_api_v1_detections_recent_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/detections/tags:
    get:
      tags:
      - Detections / ANPR (Model 2)
      summary: Tags in use, with counts
      description: 'Every tag currently applied, with how many detections carry it.


        Drives the filter list in the operator UI, so it reflects what the control

        room actually uses rather than what was imagined up front.'
      operationId: list_tags_api_v1_detections_tags_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/detections/{detection_id}/tags:
    post:
      tags:
      - Detections / ANPR (Model 2)
      summary: Tag a detection
      description: 'Apply event tags to a detection.


        Tags are merged rather than replaced, so two operators working the same

        incident do not overwrite each other. Tagging is audited: it is an

        operator''s assertion about a vehicle, and the trail should say who made it.'
      operationId: tag_detection_api_v1_detections__detection_id__tags_post
      security:
      - HTTPBearer: []
      parameters:
      - name: detection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Detection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/detections/{detection_id}/tags/{tag}:
    delete:
      tags:
      - Detections / ANPR (Model 2)
      summary: Remove one tag
      operationId: untag_detection_api_v1_detections__detection_id__tags__tag__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: detection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Detection Id
      - name: tag
        in: path
        required: true
        schema:
          type: string
          title: Tag
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/watchlist:
    get:
      tags:
      - Watchlist (Model 2)
      summary: List watchlist entries
      operationId: list_watchlist_api_v1_watchlist_get
      security:
      - HTTPBearer: []
      parameters:
      - name: active_only
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Active Only
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WatchlistOut'
                title: Response List Watchlist Api V1 Watchlist Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Watchlist (Model 2)
      summary: Add a plate to the watchlist
      operationId: add_to_watchlist_api_v1_watchlist_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchlistCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchlistOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/watchlist/{entry_id}:
    delete:
      tags:
      - Watchlist (Model 2)
      summary: Deactivate a watchlist entry
      operationId: remove_from_watchlist_api_v1_watchlist__entry_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Entry Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/watchlist/bulk-import:
    post:
      tags:
      - Watchlist (Model 2)
      summary: Bulk import plates from CSV (plate,reason,severity,case_ref)
      operationId: bulk_import_api_v1_watchlist_bulk_import_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_bulk_import_api_v1_watchlist_bulk_import_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
