# Serves the built console and proxies the API on the same origin, so the
# browser needs no CORS exception and no API host is baked into the bundle.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets are immutable; the shell must never be cached or a deploy
    # leaves clients on an old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Client-side routing: unknown paths fall through to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Video segments are large and the sandbox is slow under load.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /evidence/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Alerts arrive over a WebSocket, which needs the upgrade headers.
    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
