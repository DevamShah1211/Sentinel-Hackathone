<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Sentinel">
  <!--
    Sentinel mark: the shield from the console sidebar, with a camera aperture at
    its centre — surveillance under guard, which is what the platform is for.
    Drawn to read at 16 px: heavy strokes, no detail that disappears when scaled.
  -->
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Dark ground so the mark holds up on a light browser tab as well as a dark one -->
  <rect width="32" height="32" rx="7" fill="#0b0f1a"/>

  <!-- Shield -->
  <path d="M16 4.2 L25.4 7.6 V15.2 C25.4 21.1 20.9 25.6 16 27.4
           C11.1 25.6 6.6 21.1 6.6 15.2 V7.6 Z"
        fill="url(#shield)"/>

  <!-- Camera aperture -->
  <circle cx="16" cy="14.6" r="4.6" fill="#0b0f1a"/>
  <circle cx="16" cy="14.6" r="2.4" fill="#7dd3fc"/>
  <circle cx="17.1" cy="13.5" r="0.8" fill="#e0f2fe"/>
</svg>
